{% extends "layouts/dashboard_base.html" %}

{% block title %}الحالات المرضية{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>الحالات المرضية</h4>
    <a href="{{ url_for('medical_cases.create_medical_case_page') }}" class="btn btn-primary">
        <i class="fas fa-plus"></i> إضافة حالة جديدة
    </a>
</div>

<!-- بطاقة البحث والفلترة -->
<div class="card shadow mb-4">
    <div class="card-header bg-light">
        <h5 class="mb-0">بحث وفلترة</h5>
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="ابحث بالوصف أو العلاج...">
                </div>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="startDate" placeholder="من تاريخ">
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="endDate" placeholder="إلى تاريخ">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" id="searchBtn">بحث</button>
            </div>
        </div>
    </div>
</div>

<!-- جدول الحالات المرضية -->
<div class="card shadow">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="medicalCasesTable">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>المريض</th>
                        <th>تاريخ الحالة</th>
                        <th>التشخيص</th>
                        <th>الطبيب</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="medicalCasesTableBody">
                    <!-- سيتم ملؤه بالجافاسكريبت -->
                </tbody>
            </table>
        </div>

        <!-- الترقيم الصفحي -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- سيتم ملؤه بالجافاسكريبت -->
            </ul>
        </nav>
    </div>
</div>

<!-- JavaScript -->
<script>
    let currentPage = 1;
    let currentSearch = '';
    let currentStartDate = '';
    let currentEndDate = '';

    // تحميل البيانات عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', function () {
        loadMedicalCases();

        // أحداث البحث
        document.getElementById('searchBtn').addEventListener('click', function () {
            currentSearch = document.getElementById('searchInput').value;
            currentStartDate = document.getElementById('startDate').value;
            currentEndDate = document.getElementById('endDate').value;
            currentPage = 1;
            loadMedicalCases();
        });

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                currentSearch = this.value;
                currentPage = 1;
                loadMedicalCases();
            }
        });
    });

    // تحميل قائمة الحالات المرضية
    function loadMedicalCases() {
        const params = new URLSearchParams({
            page: currentPage,
            per_page: 10,
            search: currentSearch,
            start_date: currentStartDate,
            end_date: currentEndDate
        });

        fetch(`/api/medical-cases?${params}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderMedicalCasesTable(data.medical_cases);
                    renderPagination(data);
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('حدث خطأ في تحميل البيانات');
            });
    }

    // عرض البيانات في الجدول
    function renderMedicalCasesTable(cases) {
        const tbody = document.getElementById('medicalCasesTableBody');
        tbody.innerHTML = '';

        if (cases.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-4">
                    <i class="fas fa-stethoscope fa-2x text-muted mb-2"></i>
                    <p class="text-muted">لا توجد حالات مرضية</p>
                </td>
            </tr>
        `;
            return;
        }

        let index = (currentPage - 1) * 10 + 1;
        cases.forEach(caseItem => {
            const row = document.createElement('tr');

            // تقصير الوصف إذا كان طويلاً
            const shortDescription = caseItem.case_description && caseItem.case_description.length > 50
                ? caseItem.case_description.substring(0, 50) + '...'
                : caseItem.case_description || 'لا يوجد وصف';

            row.innerHTML = `
            <td>${index}</td>
            <td>
                <strong>${caseItem.patient_name || 'غير معروف'}</strong>
            </td>
            <td>${caseItem.case_date ? caseItem.case_date.split('T')[0] : '-'}</td>
            <td>${shortDescription}</td>
            <td>${caseItem.doctor_name || 'غير معروف'}</td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <a href="/medical-cases/${caseItem.id}" class="btn btn-outline-info" title="معاينة">
                        <i class="fas fa-eye"></i>
                    </a>
                    <a href="/medical-cases/${caseItem.id}/edit" class="btn btn-outline-primary" title="تعديل">
                        <i class="fas fa-edit"></i>
                    </a>
                </div>
            </td>
        `;

            tbody.appendChild(row);
            index++;
        });
    }

    // عرض الترقيم الصفحي
    function renderPagination(data) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        // زر السابق
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${!data.has_prev ? 'disabled' : ''}`;
        prevLi.innerHTML = `
        <a class="page-link" href="#" ${data.has_prev ? 'onclick="changePage(' + (currentPage - 1) + ')"' : ''}>
            &laquo; السابق
        </a>
    `;
        pagination.appendChild(prevLi);

        // أرقام الصفحات
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(data.pages, currentPage + 2);

        for (let i = startPage; i <= endPage; i++) {
            const pageLi = document.createElement('li');
            pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
            pageLi.innerHTML = `
            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
        `;
            pagination.appendChild(pageLi);
        }

        // زر التالي
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${!data.has_next ? 'disabled' : ''}`;
        nextLi.innerHTML = `
        <a class="page-link" href="#" ${data.has_next ? 'onclick="changePage(' + (currentPage + 1) + ')"' : ''}>
            التالي &raquo;
        </a>
    `;
        pagination.appendChild(nextLi);
    }

    // تغيير الصفحة
    function changePage(page) {
        currentPage = page;
        loadMedicalCases();
        window.scrollTo(0, 0);
    }
</script>
{% endblock %}
